<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Watchlist Top Stories</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="feed-toolbar">
      <nav id="pool-tabs" class="pool-tabs" role="tablist" aria-label="新闻关注池"></nav>
      <div class="company-picker">
        <label for="company-select">公司</label>
        <select id="company-select" aria-label="选择公司"></select>
      </div>
      <span id="feed-state" aria-live="polite"></span>
    </header>
    <main id="widget-host" aria-label="TradingView 公司新闻"></main>
    <noscript>This news panel requires JavaScript.</noscript>
  </body>
</html>
